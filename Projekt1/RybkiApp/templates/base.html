<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}RybkiApp{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(to bottom right, #e0f7fa, #ffffff);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #00796b;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        nav {
            display: flex;
            align-items: center;
        }

        nav a, .logout-button {
            color: white;
            text-decoration: none;
            font-weight: 600;
            padding: 0.5rem 1rem;
            margin-left: 1rem;
            background-color: #009688;
            border-radius: 8px;
            transition: background-color 0.3s;
        }

        nav a:hover, .logout-button:hover {
            background-color: #00796b;
        }

        .logout-button {
            cursor: pointer;
            border: none;
            background-color: #009688;
        }

        .auth-greeting {
            font-weight: 600;
            margin-left: 1rem;
            color: #e0f2f1;
        }

        .container {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .add-post-btn {
            display: inline-block;
            background-color: #00796b;
            color: white;
            padding: 0.8rem 1.5rem;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s ease;
            text-align: center;
            margin-bottom: 2rem;
        }

        .add-post-btn:hover {
            background-color: #004d40;
            transform: translateY(-3px);
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.3);
        }

        .add-post-btn:active {
            transform: translateY(0);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .edit-btn,
        .delete-btn {
            display: inline-block;
            padding: 0.5rem 1rem;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
            margin-right: 0.5rem;
        }

        .edit-btn {
            background-color: #4caf50;
            color: white;
        }

        .edit-btn:hover {
            background-color: #388e3c;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .delete-btn {
            background-color: #f44336;
            color: white;
        }

        .delete-btn:hover {
            background-color: #d32f2f;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        footer {
            background-color: #004d40;
            color: #e0f2f1;
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>🐟 RybkiApp</h1>
        <nav>
            <a href="/">Strona Główna</a>

            {% if request.user.is_authenticated %}
                <span class="auth-greeting">Witaj, {{ request.user.username }}!</span>
                <form action="{% url 'logout' %}" method="post" style="margin-left: 1rem;">
                    {% csrf_token %}
                    <button type="submit" class="logout-button">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Logowanie</a>
                <a href="{% url 'register' %}">Rejestracja</a>
            {% endif %}
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        &copy; {{ now|default:"2025" }}  Rybki app
    </footer>
</body>
</html>
